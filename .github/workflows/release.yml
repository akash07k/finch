# Builds and submits the extension to Chrome Web Store and Firefox AMO.
#
# Triggers: pushing a tag like v1.0.1, or manual workflow_dispatch from
# the Actions tab. Tag-triggered runs verify the tag suffix matches
# extension/package.json's version and fail fast on mismatch.
#
# Store submissions are independent — a Chrome failure does not block
# Firefox, and vice versa. Artifacts and GitHub Releases are created
# as long as the zips built successfully, regardless of submission
# outcome. A final "Report submission status" step fails the job if
# either store rejected, so you get the red X notification.
#
# Before first use, run `pnpm submit:init` locally (in extension/) to
# write .env.submit, then copy the values from that file into your
# GitHub repo secrets using the names listed below.
#
# Required secrets:
#   Chrome Web Store:
#     CHROME_EXTENSION_ID   — assigned after first manual upload
#     CHROME_CLIENT_ID      — from Google Cloud Console OAuth
#     CHROME_CLIENT_SECRET  — from Google Cloud Console OAuth
#     CHROME_REFRESH_TOKEN  — from Google Cloud Console OAuth
#   Firefox AMO:
#     FIREFOX_EXTENSION_ID  — our gecko UUID: {e5b3402e-127a-4eff-8529-77c5d34363f6}
#     FIREFOX_JWT_ISSUER    — from AMO API keys page
#     FIREFOX_JWT_SECRET    — from AMO API keys page

name: Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which store(s) to submit to"
        type: choice
        options:
          - both
          - chrome
          - firefox
        default: both
      create_release:
        description: "Also create the GitHub Release (tag dispatches do this automatically)"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    env:
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
      CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
      CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
      FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
      FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
      FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
      CHROME_PUBLISH_TARGET: ${{ secrets.CHROME_PUBLISH_TARGET || 'default' }}
      CHROME_SKIP_SUBMIT_REVIEW: ${{ secrets.CHROME_SKIP_SUBMIT_REVIEW || 'false' }}
      FIREFOX_CHANNEL: ${{ secrets.FIREFOX_CHANNEL || 'listed' }}
    steps:
      - uses: actions/checkout@v6

      - name: Verify tag matches extension/package.json version
        if: github.ref_type == 'tag'
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(jq -r .version extension/package.json)
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match extension/package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Version check passed: tag v$TAG_VERSION matches extension/package.json $PKG_VERSION"

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies (skip lifecycle scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build logger package
        run: pnpm build:logger

      - name: Prepare WXT (generates .wxt/tsconfig.json the gates need)
        working-directory: extension
        run: pnpm exec wxt prepare

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm lint

      - name: Markdown lint
        run: pnpm lint:md

      - name: Test
        run: pnpm -r test

      - name: Zip both extensions (chrome + firefox + sources)
        id: zip
        working-directory: extension
        run: pnpm zip

      # ── Store submissions ─────────────────────────────────────────
      #
      # Chrome and Firefox are independent steps with continue-on-error
      # so one store's failure doesn't block the other. The TARGET input
      # controls which stores to attempt; tag pushes default to both.
      #
      # steps.<id>.outcome gives the real result (success/failure)
      # even when continue-on-error masks it as conclusion=success.

      - name: Submit to Chrome Web Store
        id: chrome_submit
        if: ${{ inputs.target == 'chrome' || inputs.target == 'both' || inputs.target == '' }}
        continue-on-error: true
        working-directory: extension
        run: node scripts/submit.mjs --chrome-only

      - name: Submit to Firefox AMO
        id: firefox_submit
        if: ${{ inputs.target == 'firefox' || inputs.target == 'both' || inputs.target == '' }}
        continue-on-error: true
        working-directory: extension
        run: node scripts/submit.mjs --firefox-only

      # ── Post-submit: artifacts and GitHub Release ─────────────────
      #
      # These run as long as zips built successfully, regardless of
      # whether store submissions succeeded. This ensures sideloadable
      # zips are always available and the GitHub Release is created.

      - name: Upload artifacts
        if: ${{ !cancelled() && steps.zip.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: extension-zips
          include-hidden-files: true
          path: |
            extension/.output/*-chrome.zip
            extension/.output/*-firefox.zip
            extension/.output/*-sources.zip

      - name: Determine release tag
        id: release_tag
        if: ${{ !cancelled() && steps.zip.outcome == 'success' && (github.ref_type == 'tag' || inputs.create_release) }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(jq -r .version extension/package.json)
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog section for release notes
        if: ${{ !cancelled() && steps.zip.outcome == 'success' && (github.ref_type == 'tag' || inputs.create_release) }}
        run: |
          VERSION="${{ steps.release_tag.outputs.version }}"
          awk -v ver="$VERSION" '
            BEGIN { hdr1 = "## " ver; hdr2 = "## [" ver "]" }
            (index($0, hdr1) == 1 || index($0, hdr2) == 1) { found=1; print; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md section found for version $VERSION. Add a '## $VERSION' entry before tagging."
            exit 1
          fi
          echo "Extracted $(wc -l < release-notes.md) lines of release notes for v$VERSION"

      - name: Create GitHub Release with sideloadable assets
        if: ${{ !cancelled() && steps.zip.outcome == 'success' && (github.ref_type == 'tag' || inputs.create_release) }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Finch ${{ steps.release_tag.outputs.tag }}
          body_path: release-notes.md
          files: |
            extension/.output/*-chrome.zip
            extension/.output/*-firefox.zip
            extension/.output/*-sources.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

      # ── Final status ──────────────────────────────────────────────
      #
      # continue-on-error on the submit steps masks failures from the
      # job status. This step checks the real outcomes and fails the
      # job if either store rejected, so the Actions UI shows a red X
      # and notifications fire. It runs after artifacts and the GitHub
      # Release are safely created.

      - name: Report submission status
        if: ${{ !cancelled() && steps.zip.outcome == 'success' }}
        run: |
          CHROME="${{ steps.chrome_submit.outcome }}"
          FIREFOX="${{ steps.firefox_submit.outcome }}"
          echo "Chrome:  ${CHROME:-skipped}"
          echo "Firefox: ${FIREFOX:-skipped}"
          FAILED=0
          if [ "$CHROME" = "failure" ]; then
            echo "::error::Chrome Web Store submission failed"
            FAILED=1
          fi
          if [ "$FIREFOX" = "failure" ]; then
            echo "::error::Firefox AMO submission failed"
            FAILED=1
          fi
          exit $FAILED
